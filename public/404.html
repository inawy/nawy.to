<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nawy.to</title><style>:root{color-scheme:dark;font-family:Cairo,"Segoe UI",Tahoma,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080c16;color:#f6f8ff}main{width:min(92vw,520px);padding:28px;text-align:center}.dot{width:38px;height:38px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid rgba(61,123,255,.3);border-radius:999px}.dot i{width:8px;height:8px;border-radius:50%;background:#3d7bff;box-shadow:0 0 22px rgba(61,123,255,.7)}h1{margin:0;font-size:2.6rem}p{color:#9ca7bd;line-height:1.8}a{display:inline-block;margin-top:10px;color:#fff;background:#3d7bff;padding:12px 18px;border-radius:14px;text-decoration:none}</style></head><body><main><div class="dot"><i></i></div><h1>لحظة…</h1><p id="message">ناوي يحاول يوصلك للمكان الصح.</p><a href="/">العودة إلى ناوي تو</a></main><script>(async()=>{const slug=location.pathname.replace(/^\/+|\/+$/g,"").split("/")[0].toLowerCase();if(!slug)return;try{const r=await fetch("/links.json",{cache:"no-store"});if(!r.ok)throw 0;const routes=await r.json();const route=Object.entries(routes).find(([key,value])=>key.toLowerCase()===slug||((value.aliases||[]).some(alias=>String(alias).toLowerCase()===slug)));if(route){const value=route[1];if(value.status==="coming-soon"){document.querySelector("h1").textContent=value.label||"قريبًا";document.getElementById("message").textContent=value.description||"الوجهة دي لسه بتتجهز في ناوي.";document.querySelector("a").textContent="ارجع إلى ناوي تو";return}if(value.url&&/^https?:\/\//i.test(value.url)){location.replace(value.url);return}}}catch(_){}document.getElementById("message").textContent="الرابط ده مش موجود حاليًا."})()</script></body></html>
